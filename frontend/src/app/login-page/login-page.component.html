<h1 class="text-center mb-4"><strong>Login</strong></h1>

<div id="login-label">
  <form class="border p-4 shadow-sm" style="min-width: 350px;">

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control form-control-sm">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control form-control-sm">
    </div>

    <button class="btn btn-primary w-100 btn-sm">
      Login
    </button>

    <div class="mb-3 text-center">
      <sub class="sub-desc">
        Are you new here? <a routerLink="/signin">Create your account!</a>
      </sub>
    </div>

  </form>
</div>
