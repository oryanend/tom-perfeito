<ul class="piano">
  <li *ngFor="let key of keys" class="key" [ngClass]="key.type" (click)="onKeyClick(key)" [class.active]="isSelected(key)">
    <span *ngIf="isSelected(key)" class="note-label"> {{ getDisplayNote(key) }}</span>
  </li>
</ul>

<div class="chords-container" *ngIf="chords.length > 0">
  <h4>Acordes encontrados:</h4>

  <div *ngFor="let chord of chords" class="chord-badge">
    {{ chord.name }}
  </div>
</div>
