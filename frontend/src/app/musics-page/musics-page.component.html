<div class="text-center mb-4">
  <h1><strong>Musics</strong></h1>
</div>

<div id="window" class="mb-3">

  <div *ngFor="let music of musics" class="mb-3">
    <h3>
      <strong>
      <a [href]="music.link" target="_blank">
        {{ music.title }}
      </a>
      </strong>
    </h3>
    <p>
      {{ music.description | slice:0:50 }}<span *ngIf="music.description.length > 50">...</span>
    </p>
  </div>

</div>


<nav aria-label="Page navigation example" *ngIf="totalPages > 1">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="currentPage === 0">
      <a class="page-link" (click)="previousPage()">
        &laquo;
      </a>
    </li>
    <li
      class="page-item"
      *ngFor="let page of pages"
      [class.active]="page === currentPage"
    >
      <a class="page-link" (click)="goToPage(page)">
        {{ page + 1 }}
      </a>
    </li>
    <li class="page-item" [class.disabled]="currentPage === totalPages - 1">
      <a class="page-link" (click)="nextPage()">
        &raquo;
      </a>
    </li>
  </ul>
</nav>
