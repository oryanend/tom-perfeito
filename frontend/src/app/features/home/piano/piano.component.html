<ul class="piano">
  @for (key of keys; track key) {
    <li
      class="key"
      [ngClass]="key.type"
      (click)="onKeyClick(key)"
      (keyup.enter)="onKeyClick(key)"
      tabindex="0"
      [class.active]="isSelected(key)"
    >

      @if (isSelected(key)) {
        <span class="note-label">
          {{ getDisplayNote(key) }}
        </span>
      }
    </li>
  }
</ul>


@if (chords.length > 0) {

  <div class="chords-container">
    <h4>Chords:</h4>

    @for (chord of chords; track chord) {
      <div class="chord-badge">
        {{ chord.name }}
      </div>
    }
  </div>
} @else if (isLoading) {
  <div class="text-center placeholder-glow d-flex flex-column gap-3 align-items-center">
    <span class="placeholder col-12 placeholder-lg" style="width: 50%"></span>
    <span class="placeholder col-12 placeholder-sm" style="width: 20%"></span>
  </div>
}
